stages:
  - build
  - test
  - docker-build
  - docker-push
  - deploy

  
# 1. BUILD
build_job:
  stage: build
  image: node:20
  script:
    - npm ci 
    - npm test -- --coverage
  artifacts:
    paths:
      - coverage/
    expire_in: 1h

# ------------------------------
# 2. TEST
# ------------------------------
test_job:
  stage: test
  image: node:20
  script: 
    - npm ci 
    - npm test

 # ------------------------------
# 3. DOCKER BUILD
# ------------------------------
docker-build:
  stage: docker-build
  image: docker:25
  services:
    - name: docker:25-dind
      command: ["--tls=false"]
      
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""   
  script:
    - docker info
    - docker build -t my-image:latest .

# ------------------------------
# 4. DOCKER PUSH (Nexus)
# ------------------------------
docker_push:
  stage: docker-push
  image: docker:25
   
  services:
    - name: docker:25-dind
      command: 
        - "--tls=false"
        - "--add-host=registry.local:172.17.0.1"
  script:
    - echo "$REGISTRY_URL" 
    - echo "$NEXUS_PASSWORD" | docker login $REGISTRY_URL -u "$NEXUS_USERNAME" --password-stdin
    - docker push $REGISTRY_URL/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/$IMAGE_NAME:latest 

# ------------------------------
# 5. DEPLOY LOCAL
# ------------------------------
deploy_local:
  stage: deploy
  image: docker:25
  services:
    - name: docker:25-dind
      command: ["--tls=false"]
  script:
    - echo "$NEXUS_PASSWORD" | docker login $REGISTRY_URL -u "$NEXUS_USERNAME" --password-stdin

    # Stop/remove old container (ignore errors)
    - docker rm -f tp-gitlab-ci || true

    # Pull & Run
    - docker pull $REGISTRY_URL/$IMAGE_NAME:latest
    - docker run -d --name tp-gitlab-ci -p 3000:3000 $REGISTRY_URL/$IMAGE_NAME:latest


